<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Fighter - Estilo MUGEN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #game-canvas {
            display: block;
            background: linear-gradient(to bottom, #2a2a4a 0%, #1a1a2e 100%);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
        }

        .health-bar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .player-name {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .health-bar {
            width: 350px;
            height: 25px;
            background: #333;
            border: 3px solid #666;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
            position: relative;
        }

        .health-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        #p1-health .health-fill {
            background: linear-gradient(90deg, #ff4444, #ff6666);
            width: 100%;
        }

        #p2-health .health-fill {
            background: linear-gradient(90deg, #4444ff, #6666ff);
            width: 100%;
        }

        .health-damage {
            position: absolute;
            top: 0;
            height: 100%;
            background: #ffff00;
            transition: width 0.5s ease;
        }

        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            border: 3px solid #666;
            border-radius: 8px;
            padding: 10px 20px;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            text-align: center;
            display: none;
            z-index: 100;
        }

        #controls-info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
            text-align: center;
        }

        .control-group {
            display: inline-block;
            margin: 0 20px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .key {
            display: inline-block;
            background: #444;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="1024" height="576"></canvas>
        
        <div id="ui-layer">
            <div class="health-bar-container">
                <div class="player-info">
                    <div class="player-name" id="p1-name">Jugador 1</div>
                    <div class="health-bar" id="p1-health">
                        <div class="health-fill"></div>
                        <div class="health-damage"></div>
                    </div>
                </div>
                
                <div id="timer">60</div>
                
                <div class="player-info">
                    <div class="player-name" id="p2-name">Jugador 2</div>
                    <div class="health-bar" id="p2-health">
                        <div class="health-fill"></div>
                        <div class="health-damage"></div>
                    </div>
                </div>
            </div>
            
            <div id="controls-info">
                <div class="control-group">
                    <strong>J1:</strong> 
                    <span class="key">A</span><span class="key">D</span> Mover | 
                    <span class="key">W</span> Saltar | 
                    <span class="key">S</span> Agacharse | 
                    <span class="key">F</span> Golpear | 
                    <span class="key">G</span> Patada
                </div>
                <div class="control-group">
                    <strong>J2:</strong> 
                    <span class="key">←</span><span class="key">→</span> Mover | 
                    <span class="key">↑</span> Saltar | 
                    <span class="key">↓</span> Agacharse | 
                    <span class="key">K</span> Golpear | 
                    <span class="key">L</span> Patada
                </div>
            </div>
        </div>
        
        <div id="message"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
